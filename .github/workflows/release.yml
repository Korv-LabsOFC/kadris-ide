name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (e.g. v0.1.0-alpha.1)
        required: true
        type: string
      confirmation:
        description: Type CREATE DRAFT to continue
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: ${{ inputs.confirmation == 'CREATE DRAFT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Validate tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: linux-installers
            paths: |
              dist/**/*.AppImage
              dist/**/*.deb
          - os: windows-latest
            target: win
            artifact: windows-installers
            paths: |
              dist/**/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build:web && npm run build:portable
      - run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
      - name: Generate checksums
        run: sha256sum dist/**/*.{AppImage,deb,exe} > SHA256SUMS.release
      - name: Create draft release
        run: |
          gh release create "${{ inputs.tag }}" \
            dist/**/*.AppImage dist/**/*.deb dist/**/*.exe SHA256SUMS.release \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Kadris ${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
