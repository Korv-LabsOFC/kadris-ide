name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web, portable, and desktop targets
        run: npm run build

      - name: Inspect npm package contents
        run: npm pack --dry-run

      - name: Check CLI help
        run: node dist/cli/index.js --help

      - name: Check CLI version
        run: node dist/cli/index.js --version

      - name: Check CLI environment diagnostics
        run: node dist/cli/index.js --diagnose-env

      - name: Check CLI JSON environment diagnostics
        run: node dist/cli/index.js --diagnose-env --json
