name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run build:portable
      - run: node dist/cli/index.js --help
      - run: node dist/cli/index.js --version
      - run: node dist/cli/index.js --diagnose-env
      - run: node dist/cli/index.js --diagnose-env --json
      - run: npm pack --dry-run
      - name: Verify Electron is absent from npm package
        run: node -e "const p=require('./package.json'); if (p.dependencies?.electron) { console.error('Electron in dependencies!'); process.exit(1) } else { console.log('OK: Electron not in dependencies') }; if (p.devDependencies?.electron) console.log('Note: Electron is in devDependencies (expected)')"
