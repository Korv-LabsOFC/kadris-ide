name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: alpha
        type: string
      confirmation:
        description: Type PUBLISH kadris to continue
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH kadris' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - name: Verify npm tag is valid
        run: |
          if [[ "${{ inputs.npm_tag }}" =~ [^a-z0-9-] ]]; then
            echo "Invalid npm tag: ${{ inputs.npm_tag }}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm test
      - run: npm run build:web && npm run build:portable
      - run: npm pack --dry-run
      - name: Verify Electron is absent from package
        run: node -e "const p=require('./package.json'); if (p.dependencies?.electron) { process.exit(1) }"
      - run: npm publish --access public --provenance --tag "${{ inputs.npm_tag }}"
