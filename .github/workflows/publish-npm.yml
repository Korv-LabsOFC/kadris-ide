name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: string
      confirmation:
        description: Type PUBLISH kadris to continue
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH kadris' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Validate dispatch and package metadata
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          case "$NPM_TAG" in
            ''|*[!A-Za-z0-9._-]*) echo "Invalid npm distribution tag" >&2; exit 1 ;;
          esac
          node -e "const p=require('./package.json'); if(p.name!=='kadris') throw Error('Unexpected package name'); if(p.private!==false) throw Error('package.json must explicitly set private to false before publication'); if(!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)) throw Error('Version is not publishable')"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm pack --dry-run
          node dist/cli/index.js --help
          node dist/cli/index.js --version
          node dist/cli/index.js --diagnose-env --json

      - name: Publish with npm trusted publishing
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"
