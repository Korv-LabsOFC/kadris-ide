name: Bug report
description: Report a reproducible Kadris defect without sensitive data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, session-token URLs, private workspace content, or security exploit details. Native Termux has not been officially verified on a real Android device.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Electron desktop
        - Local web on Linux
        - Native Termux on Android (unverified)
        - WSL, SSH, container, or headless
        - Environment diagnostics only
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kadris version
      description: Output of kadris --version, if available
      placeholder: Kadris 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of node --version
      placeholder: v22.12.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment diagnostics
      description: Paste non-sensitive output from kadris --diagnose-env --verbose. Remove paths or other details you consider private.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Start Kadris with...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, credentials, and private content before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, token-bearing URLs, and private workspace content.
          required: true
        - label: This is not a confidential security report.
          required: true
